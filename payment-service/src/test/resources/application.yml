spring:
  datasource:
    url: jdbc:h2:mem:payment_test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false

stripe:
  secret-key: test-stripe-secret-key
  webhook-secret: test-stripe-webhook-secret
