# Isolated, disposable Phase 1 test infrastructure. No production volumes or credentials.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: orderflow_phase1
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${PHASE1_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d orderflow_phase1"]
      interval: 1s
      timeout: 5s
      retries: 60
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${PHASE1_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 5s
      retries: 60
